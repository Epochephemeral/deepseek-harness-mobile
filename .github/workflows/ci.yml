name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package is no longer published on current runners.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      # :app was missing here, so nothing under app/src/test ever ran on CI.
      - name: Unit tests
        run: ./gradlew :core:test :mock-harness:test :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-debug
          path: app/build/outputs/apk/debug/*.apk

  reader-device-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reader client contract and SQLite/Compose regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/test-reader.sh --stacktrace
      - name: Upload reader regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-device-regression-results
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
            core/build/reports/tests/test
            app/build/reports/tests/testDebugUnitTest

  harness-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 687f282e8625c6b8d11ff58211a90524be2e4317
          path: build/harness-0.2.1-rc.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false
      - name: Build pinned harness
        working-directory: build/harness-0.2.1-rc.2
        run: |
          pnpm install --frozen-lockfile
          # POSIX session checkpoints require the native flock addon before any model turn.
          pnpm run build:native-system
          pnpm run build:lib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Real harness conformance
        env:
          DSH_HARNESS_SRC: ${{ github.workspace }}/build/harness-0.2.1-rc.2
        run: ./gradlew :core:test :conformance:test --stacktrace
      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-conformance-results
          path: |
            conformance/build/reports/tests/test
            conformance/build/conformance-logs
